name: Build metadata assets

on:
  push:
    paths:
      - "data/**"
      - "outputs/metadata/tables/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-metadata-assets.yml"
  pull_request:
    paths:
      - "data/**"
      - "outputs/metadata/tables/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/build-metadata-assets.yml"
  workflow_dispatch:

jobs:
  build-metadata-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check script syntax
        run: python -m py_compile scripts/*.py

      - name: Build table assets
        run: python scripts/build_all_assets.py

      - name: Verify generated assets are committed
        run: |
          git diff --exit-code -- \
            data/refined/irpf_extracted_tables_manifest.csv \
            data/refined/irpf_extracted_values_long.csv \
            data/refined/extractions \
            data/refined/macro/usd_2026_conversion_factors.csv \
            data/trusted/irpf_distribution_brackets_all_sources.csv \
            data/trusted/irpf_distribution_totals_all_sources.csv \
            data/trusted/irpf_distribution_data_dictionary.csv \
            data/trusted/irpf_distribution_bracket_values_usd_2026.csv \
            data/trusted/irpf_distribution_total_values_usd_2026.csv \
            data/trusted/irpf_distribution_source_metadata_yearly.csv \
            outputs/metadata/tables/irpf_distribution_metadata_reference_table.csv \
            outputs/metadata/tables/irpf_distribution_metadata_reference_table.pdf
