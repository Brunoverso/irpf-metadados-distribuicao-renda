<text x="640.0" y="788.0" class="axis" text-anchor="middle">Faixas de renda publicadas (Cr$ 1,00)</text>
<text class="axis" transform="translate(28,358.0) rotate(-90)" text-anchor="middle">Declarantes</text>
<text x="34.0" y="828.0" class="note">Eixo X: faixas de renda publicadas pela fonte (Cr$ 1,00). Eixo Y: declarantes. O AEF 1980 cobre ano-base 1978/exercicio 1979, mas nao traz a matriz</text>
<text x="34.0" y="845.0" class="note">nacional detalhada de renda liquida por classes de renda liquida que foi usada nos AEF 1976-1979. As tabelas 1 e 2 classificam os declarantes por</text>
<text x="34.0" y="862.0" class="note">classes de rendimento bruto total; a tabela 2 decompoe a renda...</text>
