<text x="34.0" y="828.0" class="note">Eixo X: faixas de renda publicadas pela fonte (Cr$ 1,00). Eixo Y: declarantes. O AEF 1981 cobre ano-base 1979/exercicio 1980, mas nao traz a matriz</text>
<text x="34.0" y="845.0" class="note">nacional detalhada de renda liquida por classes de renda liquida que foi usada nos AEF 1976-1979. As tabelas 1 e 2 classificam os declarantes por</text>
